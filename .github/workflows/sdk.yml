name: Private SDK build
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Open same-repository PR number; review its exact head before approving sdk-build'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-sdk-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve the exact reviewed PR head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          sha=$(python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/pr.json")); assert p["state"]=="open" and p["base"]["ref"]=="main" and p["head"]["repo"]["full_name"]==os.environ["GITHUB_REPOSITORY"]; print(p["head"]["sha"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Review PR #$PR_NUMBER at $sha before approving the sdk-build environment." >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=pending -f context=sdk \
            -f description='Awaiting approved isolated SDK build' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
  build:
    needs: prepare
    environment: sdk-build
    runs-on: [self-hosted, linux, x64, atak-sdk-5-6]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Compile, lint, test and inspect the whole plugin privately
        run: sh scripts/check-sdk-ci.sh
  result:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish exact-head SDK status
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          state=failure
          if [ "$BUILD_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=sdk \
            -f description="Private SDK build: $BUILD_RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          test "$state" = success
