name: Core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile and test Java core
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sh scripts/test.sh
      - name: Check offline Data Sync metadata probe
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python3 scripts/test-datasync-metadata-probe.py
      - name: Check local auth helper without network
        run: python3 scripts/test-github-auth.py
      - name: Check signing-source archive boundaries without network
        run: python3 scripts/test-signing-source.py
      - name: Generate and verify synthetic attachment fixture
        run: python3 scripts/create-attachment-fixture.py "$RUNNER_TEMP/TMM-IMAGE-PROBE.zip"
  images:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up public Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and lint isolated local image library
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew -p images --no-daemon testDebugUnitTest lintDebug
