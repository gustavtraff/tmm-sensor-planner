name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile and test Java core
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sh scripts/test.sh
      - name: Check local auth helper without network
        run: python3 scripts/test-github-auth.py
      - name: Generate and verify synthetic attachment fixture
        run: python3 scripts/create-attachment-fixture.py "$RUNNER_TEMP/TMM-IMAGE-PROBE.zip"
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up public Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and lint isolated local image library
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew -p images --no-daemon testDebugUnitTest lintDebug
