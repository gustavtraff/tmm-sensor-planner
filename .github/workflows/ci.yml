name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Issue 9 temporary failure-enforcement probe
        run: exit 1
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Compile and test Java core
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sh scripts/test.sh
      - name: Check local auth helper without network
        run: python3 scripts/test-github-auth.py
      - name: Generate and verify synthetic attachment fixture
        run: python3 scripts/create-attachment-fixture.py "$RUNNER_TEMP/TMM-IMAGE-PROBE.zip"
