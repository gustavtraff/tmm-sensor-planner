buildscript {
    ext.ATAK_VERSION = '5.6.0'
    ext.PLUGIN_VERSION = '0.1.0'

    def sdkDirectory = System.getenv('TMM_ATAK_SDK_DIR')
    def repositoryUrl = project.findProperty('takrepo.url')
    def forceRepository = project.findProperty('takrepo.force') == 'true'
    ext.isDevKitEnabled = { repositoryUrl != null || forceRepository || !sdkDirectory }
    ext.takrepoUrl = repositoryUrl ?: 'https://artifacts.tak.gov/artifactory/maven'
    ext.takrepoUser = project.findProperty('takrepo.user') ?: ''
    ext.takrepoPassword = project.findProperty('takrepo.password') ?: ''

    repositories {
        google()
        mavenCentral()
        if (isDevKitEnabled()) {
            maven {
                url = takrepoUrl
                credentials {
                    username = takrepoUser
                    password = takrepoPassword
                }
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            // Follow the archived third-party service requirement for ATAK >= 4.2.
            classpath 'com.atakmap.gradle:atak-gradle-takdev:2.+'
        } else {
            if (!new File(sdkDirectory, 'atak-gradle-takdev.jar').isFile()) {
                throw new GradleException('TMM_ATAK_SDK_DIR must identify the inspected ATAK-CIV 5.6.0 SDK.')
            }
            classpath files(new File(sdkDirectory, 'atak-gradle-takdev.jar'))
        }
    }
}

plugins {
    id 'com.android.application'
}

if (!isDevKitEnabled()) {
    ext.set('sdk.path', System.getenv('TMM_ATAK_SDK_DIR'))
}
apply plugin: 'atak-takdev-plugin'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'se.tmm.sensorplanner.plugin'
    compileSdk 36
    buildToolsVersion '35.0.0'

    bundle {
        storeArchive {
            enable = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId 'se.tmm.sensorplanner.plugin'
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName '0.1.0-device-details.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions 'distribution'
    productFlavors {
        civ {
            dimension 'distribution'
        }
    }

    buildTypes {
        debug {
            matchingFallbacks = ['sdk']
        }
        release {
            matchingFallbacks = ['odk']
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'src/main/proguard-rules.pro'
        }
    }
}

// Compile the dependency-free domain/storage sources into the plugin, never the SDK.
android.sourceSets.main.java.srcDir '../core/src/main/java'

dependencies {
    implementation project(':images')
    testImplementation 'junit:junit:4.13.2'
}
