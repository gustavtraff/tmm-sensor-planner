plugins {
    id 'com.android.library' version '8.13.0'
}

android {
    namespace 'se.tmm.sensorplanner.images'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        minSdk 21
        // The standalone instrumentation APK needs a modern target; the consuming app sets its own.
        targetSdk 34
        testInstrumentationRunner 'se.tmm.sensorplanner.core.PublicationCodecInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        test.java.srcDir '../core/src/main/java'
        test.java.srcDir '../app/src/main/java/se/tmm/sensorplanner/plugin/ingress'
        test.resources.srcDir '../test-fixtures/synthetic/image-offer-proposal'
        test.resources.srcDir '../test-fixtures/synthetic/publication-envelope'
        test.resources.srcDir '../test-fixtures/synthetic/image-stage-proposal'
        test.java.srcDir '../app/src/main/java/se/tmm/sensorplanner/plugin/images'
        test.java.srcDir '../app/src/main/java/se/tmm/sensorplanner/plugin/local'
        androidTest.java.srcDir '../core/src/main/java'
        androidTest.java.srcDir '../app/src/main/java/se/tmm/sensorplanner/plugin/images'
        androidTest.assets.srcDir '../test-fixtures/synthetic/publication'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging.exceptionFormat = 'full' }
    }
}

def stageProbeAssets = tasks.register('prepareImageStageProbeAssets', Sync) {
    from('../test-fixtures/synthetic/image-offer-proposal') { include 'offer-h1.bin', 'offer-h2.bin' }
    from('src/test/resources/image-transfer') { include 'h1.png', 'h2.png' }
    into layout.buildDirectory.dir('generated/imageStageProbeAssets')
}
android.sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/imageStageProbeAssets'))
// shortcut: pinned AGP consumer names; recheck merge/lint consumers when upgrading AGP.
tasks.matching { it.name in ['mergeDebugAndroidTestAssets', 'generateDebugAndroidTestLintModel', 'lintAnalyzeDebugAndroidTest'] }
        .configureEach { dependsOn stageProbeAssets }

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
